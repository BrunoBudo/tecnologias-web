<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Aluno Online</title>
</head>
<body>
    <header>
        <div>
            <img><img src="https://www.svgrepo.com/show/411955/learn.svg" alt="Logo da
            Aplicação" />
            <h1>Aluno Online</h1>
        </div>
        <div>
            <input><input type="search" name="pesquisa" placeholder="Pesquisar..."/>
            <img><img src="https://www.svgrepo.com/show/507851/search-square.svg" alt="Ícone de
            Pesquisar"/>
        </div>
    </header>
    <main>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
        <section>
            <h2>Perfil do Aluno</h2>
            <form>
                <form action="#" method="post"></form>
                <div>
                    <label>
                        <label for="nome">Nome</label>
                    </label>
                    <input><input type="text" id="nome" name="nome" />
                </div>
                <div>
                    <label>
                        <label for="email">E-mail</label>
                    </label>
                    <input><input type="email" id="email" name="email" />
                </div>
                <div>
                    <label>
                        <label for="senha">Senha</label>
                    </label>
                    <input><input type="password" id="senha" name="senha" />
                </div>
                <div>
                    <input><input type="submit" value="Salvar" />
                </div>
            </form>
        </section>
    </main>
</body>
</html>

<link rel="stylesheet" href="estilos.css">
